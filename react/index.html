<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procurement &amp; Vendor Risk Management Portal</title>
  <meta name="description"
    content="Procurement / Risk — enterprise workflow with supplier hierarchy, approvals, documents, scoring, and risk dashboards." />
  <script>
    // Theme before first paint: light or dark, from the saved choice or the system preference.
    try {
      var saved = localStorage.getItem('procurement-vendor-risk-portal-theme');
      var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.classList.toggle('sf-dark-mode', dark);
      document.documentElement.classList.toggle('e-dark-mode', dark);
    } catch (e) { /* storage blocked: light */ }
  </script>
  <style>
    :root {
      --app-loading-bg: #f6f8fb;
      --app-loading-fg: #667085;
      --app-loading-ring: #175cd3;
      --app-loading-track: #dbe5f5;
    }

    :root[data-theme='dark'] {
      --app-loading-bg: #0f172a;
      --app-loading-fg: #94a3b8;
      --app-loading-ring: #60a5fa;
      --app-loading-track: #1e3a6e;
    }

    html,
    body {
      margin: 0;
      background: var(--app-loading-bg);
    }

    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 240px;
      padding: 24px;
      box-sizing: border-box;
      color: var(--app-loading-fg);
      font: 500 14px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-align: center;
    }

    .app-loading--screen {
      position: fixed;
      inset: 0;
      min-height: 0;
      background: var(--app-loading-bg);
      z-index: 1000;
    }

    .app-loading--overlay {
      position: absolute;
      inset: 0;
      min-height: 0;
      background: color-mix(in srgb, var(--app-loading-bg) 88%, transparent);
      z-index: 5;
    }

    .app-loading__ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      box-sizing: border-box;
      border: 3px solid var(--app-loading-track);
      border-top-color: var(--app-loading-ring);
      animation: app-loading-spin 0.8s linear infinite;
    }

    @keyframes app-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loading__ring {
        animation: none;
        border-color: var(--app-loading-ring);
      }
    }

    /* #app-boot: static frame drawn before the app script and stylesheets. */
    :root {
      --boot-page: #f6f8fb;
      --boot-surface: #ffffff;
      --boot-border: #e5e9f0;
      --boot-fg: #172033;
      --boot-muted: #667085;
      --boot-brand-bg: #eef4ff;
      --boot-brand-fg: #175cd3;
    }

    :root[data-theme='dark'] {
      --boot-page: #020617;
      --boot-surface: #0f172a;
      --boot-border: #334155;
      --boot-fg: #f8fafc;
      --boot-muted: #94a3b8;
      --boot-brand-bg: #172554;
      --boot-brand-fg: #60a5fa;
    }

    #app-boot {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      background: var(--boot-page);
      color: var(--boot-fg);
      font: 400 12px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .boot-side {
      flex: 0 0 240px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 12px 0;
      background: var(--boot-surface);
      border-right: 1px solid var(--boot-border);
      overflow: hidden;
    }

    .boot-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      min-height: 40px;
    }

    .boot-logo {
      flex: 0 0 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--boot-brand-bg);
      color: var(--boot-brand-fg);
      font-size: 14px;
      font-weight: 700;
    }

    .boot-brand strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .boot-brand small {
      display: block;
      font-size: 12px;
      color: var(--boot-muted);
      white-space: nowrap;
    }

    .boot-links {
      list-style: none;
      margin: 0;
      padding: 0 12px;
      display: grid;
      gap: 4px;
    }

    .boot-links li {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      padding: 0 10px;
      border-radius: 8px;
      color: var(--boot-muted);
      white-space: nowrap;
    }

    .boot-links li.is-current {
      background: var(--boot-brand-bg);
      color: var(--boot-brand-fg);
      font-weight: 600;
    }

    .boot-links svg {
      flex: 0 0 20px;
    }

    .boot-foot {
      margin-top: auto;
      padding: 0 16px;
      color: var(--boot-muted);
    }

    .boot-work {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .boot-head {
      flex: 0 0 64px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--boot-surface);
      border-bottom: 1px solid var(--boot-border);
    }

    .boot-toggle {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--boot-muted);
    }

    .boot-head strong {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .boot-main {
      flex: 1;
      padding: 24px;
    }

    #app-boot[data-nav='docked'] .boot-side {
      flex-basis: 64px;
    }

    #app-boot[data-nav='docked'] .boot-brand>span,
    #app-boot[data-nav='docked'] .boot-links span,
    #app-boot[data-nav='docked'] .boot-foot {
      display: none;
    }

    #app-boot[data-nav='docked'] .boot-links li {
      justify-content: center;
      padding: 0;
    }

    #app-boot[data-nav='drawer'] .boot-side {
      display: none;
    }

    @media (max-width: 1023.98px) {
      .boot-main {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="app-boot" aria-busy="true">
    <aside class="boot-side" aria-hidden="true">
      <div class="boot-brand">
        <div class="boot-logo">PV</div><span><strong>Procurement &amp; Vendor Risk</strong><small>Public
            session</small></span>
      </div>
      <ul class="boot-links">
        <li data-route=""><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <rect x="3" y="3" width="7" height="9" />
            <rect x="14" y="3" width="7" height="5" />
            <rect x="14" y="12" width="7" height="9" />
            <rect x="3" y="16" width="7" height="5" />
          </svg><span>Risk Dashboard</span></li>
        <li data-route="vendors"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M3 5h7v14H3zM14 5h7v14h-7z" />
          </svg><span>Vendor Register</span></li>
        <li data-route="approvals"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
          </svg><span>Onboarding Approvals</span></li>
        <li data-route="documents"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6" />
          </svg><span>Vendor Documents</span></li>
        <li data-route="ai"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path
              d="M12 2a7 7 0 0 1 7 7c0 2.4-1.2 4.5-3 5.7V17a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2.3C6.2 13.5 5 11.4 5 9a7 7 0 0 1 7-7z" />
          </svg><span>AI Assistant</span></li>
      </ul>
      <div class="boot-foot">Built with Syncfusion</div>
    </aside>
    <div class="boot-work">
      <div class="boot-head"><span class="boot-toggle" aria-hidden="true"><svg width="20" height="20"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 3v18" />
          </svg></span><strong id="boot-title"></strong></div>
      <div class="boot-main">
        <div class="app-loading" role="status" aria-live="polite">
          <div class="app-loading__ring" aria-hidden="true"></div>
          <div id="boot-label">Loading Procurement &amp; Vendor Risk…</div>
        </div>
      </div>
    </div>
    <script>
      // Frame layout, title and current link before the first paint.
      (function () {
        var boot = document.getElementById('app-boot');
        var labels = { '': 'Risk Dashboard', vendors: 'Vendor Register & Category Hierarchy', approvals: 'Onboarding Approvals', documents: 'Vendor Documents', ai: 'AI Assistant' };
        var path = location.pathname.replace(/^\/procurement-vendor-risk-portal\/react\/?/, '').replace(/\/$/, '');
        path = path.split('/')[0] || '';
        var id = labels[path] ? path : '';
        var collapsed = false; try { collapsed = localStorage.getItem('procurement-vendor-risk-portal-nav-collapsed') === 'true'; } catch (e) { }
        var nav = window.innerWidth < 1024 ? 'drawer' : collapsed ? 'docked' : 'expanded';
        boot.setAttribute('data-nav', nav);
        document.getElementById('boot-title').textContent = labels[id];
        document.getElementById('boot-label').textContent = 'Loading ' + labels[id] + '\u2026';
        var current = boot.querySelector('[data-route="' + id + '"]'); if (current) current.className = 'is-current';
        if (path === 'healthz') boot.remove();
      })();
    </script>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
